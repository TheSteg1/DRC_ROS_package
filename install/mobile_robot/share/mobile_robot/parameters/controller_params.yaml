controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true
    diff_cont:
      type: "diff_drive_controller/DiffDriveController"
    joint_broad:
      type: "joint_state_broadcaster/JointStateBroadcaster"

diff_cont:
  ros__parameters:
    left_wheel_names: ["wheel2_joint"]
    right_wheel_names: ["wheel1_joint"]
    wheel_separation: 0.22
    wheel_radius: 0.05
    publish_rate: 50.0
    base_frame_id: "base_footprint"
    use_stamped_vel: false

